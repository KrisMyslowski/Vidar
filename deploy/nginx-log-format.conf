# JSON log_format for nginx — add this inside the http {} block
# Applied to /srv/nginx/conf/nginx.conf — last updated 2026-08-13 (V5: +$connection)
# $connection with $connection_requests identifies a request uniquely for the
# life of the nginx process. It is what lets a re-read of the log be recognised
# as a re-read: $time_iso8601 only resolves to the second, so without it two
# identical requests in one second and one request ingested twice look alike.
# NOTE: $time_iso8601 must be UTC. Vidar compares these timestamps against UTC-derived
#       bounds (today/7d/30d, retention/stale cutoffs). The default container runs UTC —
#       do not set a non-UTC TZ on the nginx host.

log_format json_log escape=json
  '{"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"request":"$request",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent",'
  '"request_time":$request_time,'
  '"ssl_protocol":"$ssl_protocol",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"server_port":$server_port,'
  '"http_accept_language":"$http_accept_language",'
  '"request_length":$request_length,'
  '"http_x_forwarded_for":"$http_x_forwarded_for",'
  '"ssl_cipher":"$ssl_cipher",'
  '"connection":$connection,'
  '"connection_requests":$connection_requests,'
  '"limit_req_status":"$limit_req_status",'
  '"http_version":"$server_protocol",'
  '"sec_fetch_dest":"$http_sec_fetch_dest",'
  '"sec_fetch_mode":"$http_sec_fetch_mode",'
  '"sec_fetch_site":"$http_sec_fetch_site",'
  '"accept_encoding":"$http_accept_encoding",'
  '"ssl_session_reused":"$ssl_session_reused"}';

access_log /var/log/nginx/access.log json_log;
