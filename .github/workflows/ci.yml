# The gate the pre-commit hook runs locally, run again where everybody can see
# it. Nothing here is new: scripts/run_tests.sh is the same entry point a
# contributor uses, so a green tick and a green local run mean the same thing.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 22, not 20: measure.mjs uses the global WebSocket, which arrived in
          # Node 21. On 20 the whole layout suite errors out.
          node-version: "22"
          cache: npm

      # The lock first, so the suite runs against exactly what the image ships;
      # dev.txt then adds the tools and finds its runtime ranges already met.
      # Two installs because --require-hashes applies to a whole invocation.
      - run: pip install --require-hashes --no-deps -r requirements/runtime.lock
      - run: pip install -r requirements/dev.txt
      - run: npm ci

      # The lock has to describe runtime.txt. Regenerating keeps existing pins,
      # so this only differs when somebody changed the ranges and did not relock
      # — which would ship an image built from dependencies nobody tested.
      - run: bash scripts/lock_requirements.sh && git diff --exit-code requirements/runtime.lock

      # VIDAR_STRICT=1 here and nowhere else. run_tests.sh lets a suite skip
      # when the machine lacks what it needs, which is right on a workstation
      # and pointless on a runner that has node and Chrome preinstalled: the
      # layout suite has no reason to skip, so a skip is a fault.
      - run: VIDAR_STRICT=1 bash scripts/run_tests.sh

  # The image the release publishes, built and run the way the server runs it:
  # read-only, no capabilities, the lock installed with hashes, its own
  # HEALTHCHECK required to pass. The gate above tests the code and never builds
  # the image, so a Dockerfile or lock that no longer installs — or a smoke test
  # that has quietly stopped proving anything, which happened — surfaced only when
  # a release tag was pushed. amd64 here; arm64 is covered by building locally.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash deploy/test_local.sh
