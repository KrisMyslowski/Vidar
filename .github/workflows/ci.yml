# The gate the pre-commit hook runs locally, run again where everybody can see
# it. Nothing here is new: scripts/run_tests.sh is the same entry point a
# contributor uses, so a green tick and a green local run mean the same thing.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: measure.mjs uses the global WebSocket, which arrived in
          # Node 21. On 20 the whole layout suite errors out.
          node-version: "22"
          cache: npm

      - run: pip install -r requirements/dev.txt
      - run: npm ci

      # VIDAR_STRICT=1 here and nowhere else. run_tests.sh lets a suite skip
      # when the machine lacks what it needs, which is right on a workstation
      # and pointless on a runner that has node and Chrome preinstalled: the
      # layout suite has no reason to skip, so a skip is a fault.
      - run: VIDAR_STRICT=1 bash scripts/run_tests.sh
