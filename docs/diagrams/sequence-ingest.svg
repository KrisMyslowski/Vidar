<rect class="bg" x="0.5" y="0.5" width="999" height="1539" rx="14"/>
<text x="30" y="44" class="ti" xml:space="preserve">Vidar — ingestion: log line to visit</text>
<text x="30" y="70" class="st" xml:space="preserve">tail_log() is an asyncio task; blocking SQLite work runs in a worker thread through db.run_db,</text>
<text x="30" y="90" class="st" xml:space="preserve">so the event loop keeps serving while a batch is written.</text>
