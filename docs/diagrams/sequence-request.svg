<text x="30" y="44" class="ti" xml:space="preserve">Vidar — a dashboard request (GET /)</text>
<text x="30" y="70" class="st" xml:space="preserve">Middleware runs outermost first. Route handlers read the database only inside _cache.fetch,</text>
<text x="30" y="90" class="st" xml:space="preserve">which moves the work to a worker thread with its own connection.</text>
